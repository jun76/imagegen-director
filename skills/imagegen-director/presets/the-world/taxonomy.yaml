# Subject tree of the "the-world" preset: 10 top categories, 108 middle categories, 1000 leaves.
#
# Schema (see guides/schema.md):
#   groups: named lists of node names, referenced by axes.yaml and rules.yaml
#   tree:   nested mapping; a node is either a mapping (children, plus optional _tags / _weight)
#           or a list of leaf subjects. Leaves are what the sampler varies.
#
# Tags used here:
#   outdoor  -> the weather axis applies
#   seasonal -> the season axis applies
#   cultural -> the region and era axes apply (people, activities, artifacts, symbols)
# _weight is the share (%) of leaves planned for each top category; the sampler ignores it.
# Guidelines for the leaves:
# - concrete enough to be a search query and recognizable in an image, yet broad enough to vary
#   ten ways along the axes; each subject appears in exactly one place
# - no real people, brands, or named works; people, activities and artifacts spread across cultures

groups:
  # A mass of these looks repulsive (trypophobia, creepy crawlies, disembodied body parts).
  # axes.yaml never gives them count "crowd or many"; rules.yaml forbids mass wording for them.
  mass-sensitive: [microbes and plankton, fungi and lichens, insects and spiders, other invertebrates,
                   fish, amphibians and reptiles, body parts, lotus, bat]
  # Subjects that legitimately show a capture device (exception to the no-capture-device rule).
  device-subjects: [smartphone, smartphone chat screen, digital camera, photography, video call, e-waste]

